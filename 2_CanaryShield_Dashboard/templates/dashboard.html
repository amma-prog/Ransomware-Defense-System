<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CanaryShield - Ransomware Detection Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #06080f;
            --bg-card: rgba(12, 20, 39, 0.75);
            --border: rgba(100, 140, 200, 0.12);
            --cyan: #00d4ff;
            --green: #00ff88;
            --red: #ff3060;
            --amber: #ffaa00;
            --text: #e2e8f0;
            --text2: #94a3b8;
            --muted: #475569;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Animated background */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse at 20% 50%, rgba(0, 212, 255, 0.06) 0%, transparent 50%),
                radial-gradient(ellipse at 80% 20%, rgba(0, 255, 136, 0.04) 0%, transparent 50%),
                radial-gradient(ellipse at 50% 80%, rgba(255, 48, 96, 0.03) 0%, transparent 50%);
            z-index: 0;
        }

        .dashboard { position: relative; z-index: 1; }

        /* HEADER */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 32px;
            background: rgba(6, 8, 15, 0.85);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        .logo-icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, var(--cyan), var(--green));
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }
        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 18px;
            border-radius: 50px;
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.5s ease;
        }
        .status-badge .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            transition: all 0.5s ease;
        }
        .status-badge.inactive { background: rgba(71, 85, 105, 0.3); border: 1px solid var(--muted); }
        .status-badge.inactive .dot { background: var(--muted); }
        .status-badge.monitoring { background: rgba(0, 255, 136, 0.1); border: 1px solid rgba(0, 255, 136, 0.4); }
        .status-badge.monitoring .dot { background: var(--green); animation: pulse 1.5s infinite; }
        .status-badge.alert { background: rgba(255, 48, 96, 0.15); border: 1px solid rgba(255, 48, 96, 0.5); }
        .status-badge.alert .dot { background: var(--red); animation: pulse 0.5s infinite; }
        .status-badge.restored { background: rgba(0, 212, 255, 0.1); border: 1px solid rgba(0, 212, 255, 0.4); }
        .status-badge.restored .dot { background: var(--cyan); }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(1.4); }
        }

        /* MAIN LAYOUT */
        .main-content {
            display: grid;
            grid-template-columns: 260px 1fr;
            gap: 20px;
            padding: 20px 32px;
            min-height: calc(100vh - 69px);
        }

        /* SIDEBAR */
        .sidebar { display: flex; flex-direction: column; gap: 16px; }
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            backdrop-filter: blur(16px);
            transition: border-color 0.3s, box-shadow 0.3s;
        }
        .card:hover { border-color: rgba(100, 140, 200, 0.25); }
        .card-title {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: var(--text2);
            margin-bottom: 16px;
        }

        /* BUTTONS */
        .btn {
            width: 100%;
            padding: 12px 16px;
            border: none;
            border-radius: 10px;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            justify-content: center;
        }
        .btn:hover { transform: translateY(-1px); }
        .btn:active { transform: translateY(0); }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
        .btn-deploy { background: linear-gradient(135deg, #1e3a5f, #1e5a3f); color: var(--cyan); }
        .btn-deploy:hover:not(:disabled) { box-shadow: 0 4px 20px rgba(0, 212, 255, 0.2); }
        .btn-start { background: linear-gradient(135deg, #0a3d2a, #1a4a2a); color: var(--green); }
        .btn-start:hover:not(:disabled) { box-shadow: 0 4px 20px rgba(0, 255, 136, 0.2); }
        .btn-stop { background: linear-gradient(135deg, #3d0a1a, #4a1a1a); color: var(--red); }
        .btn-stop:hover:not(:disabled) { box-shadow: 0 4px 20px rgba(255, 48, 96, 0.2); }
        .btn-restore { background: linear-gradient(135deg, #3d2a0a, #4a3a1a); color: var(--amber); }
        .btn-restore:hover:not(:disabled) { box-shadow: 0 4px 20px rgba(255, 170, 0, 0.2); }
        .btn-report { background: linear-gradient(135deg, #2a1a4a, #3a1a5a); color: #a78bfa; }
        .btn-report:hover:not(:disabled) { box-shadow: 0 4px 20px rgba(167, 139, 250, 0.2); }
        .btn-history { background: linear-gradient(135deg, #1a3a4a, #1a4a5a); color: var(--cyan); border: 1px solid rgba(0, 212, 255, 0.2); }
        .btn-history:hover:not(:disabled) { box-shadow: 0 4px 20px rgba(0, 212, 255, 0.15); }
        .controls { display: flex; flex-direction: column; gap: 10px; }

        /* STATS */
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .stat-item {
            text-align: center;
            padding: 12px 8px;
            background: rgba(255,255,255,0.02);
            border-radius: 10px;
            border: 1px solid var(--border);
        }
        .stat-value { font-size: 24px; font-weight: 700; font-family: 'JetBrains Mono', monospace; }
        .stat-label { font-size: 10px; color: var(--text2); text-transform: uppercase; letter-spacing: 1px; margin-top: 4px; }

        /* RIGHT CONTENT */
        .content { display: flex; flex-direction: column; gap: 16px; }
        .chart-container { height: 260px; position: relative; }
        .chart-container canvas { width: 100% !important; height: 100% !important; }

        /* FILE CARDS */
        .files-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
        .file-card {
            background: rgba(255,255,255,0.02);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 16px;
            transition: all 0.4s ease;
        }
        .file-card.safe { border-left: 3px solid var(--green); }
        .file-card.danger {
            border-left: 3px solid var(--red);
            background: rgba(255, 48, 96, 0.05);
            animation: alertFlash 1s ease-in-out 3;
        }
        @keyframes alertFlash {
            0%, 100% { background: rgba(255, 48, 96, 0.05); }
            50% { background: rgba(255, 48, 96, 0.12); }
        }
        .file-name { font-size: 13px; font-weight: 600; margin-bottom: 8px; word-break: break-all; }
        .file-meta { display: flex; justify-content: space-between; align-items: center; }
        .file-entropy {
            font-family: 'JetBrains Mono', monospace;
            font-size: 18px;
            font-weight: 700;
        }
        .file-entropy.safe { color: var(--green); }
        .file-entropy.danger { color: var(--red); }
        .file-size { font-size: 11px; color: var(--muted); }
        .file-status-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 6px;
        }
        .file-status-dot.safe { background: var(--green); }
        .file-status-dot.danger { background: var(--red); animation: pulse 0.6s infinite; }

        /* LOGS */
        .log-container {
            flex: 1;
            min-height: 200px;
            max-height: 300px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .log-entry {
            display: flex;
            gap: 10px;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 12px;
            font-family: 'JetBrains Mono', monospace;
            animation: slideIn 0.3s ease;
            line-height: 1.5;
        }
        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-10px); }
            to { opacity: 1; transform: translateX(0); }
        }
        .log-entry.info { background: rgba(0, 212, 255, 0.05); }
        .log-entry.alert { background: rgba(255, 48, 96, 0.1); border: 1px solid rgba(255, 48, 96, 0.2); }
        .log-time { color: var(--muted); white-space: nowrap; }
        .log-msg { color: var(--text); word-break: break-all; }
        .log-entry.alert .log-msg { color: var(--red); font-weight: 500; }
        .log-container::-webkit-scrollbar { width: 6px; }
        .log-container::-webkit-scrollbar-track { background: transparent; }
        .log-container::-webkit-scrollbar-thumb { background: var(--muted); border-radius: 3px; }

        .empty-state {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100px;
            color: var(--muted);
            font-size: 13px;
            font-style: italic;
        }

        /* ALERT OVERLAY */
        .alert-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(255, 0, 0, 0.05);
            pointer-events: none;
            z-index: 50;
            animation: overlayPulse 1s infinite;
        }
        .alert-overlay.active { display: block; }
        @keyframes overlayPulse {
            0%, 100% { background: rgba(255, 0, 0, 0.02); }
            50% { background: rgba(255, 0, 0, 0.07); }
        }

        /* MODAL */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            z-index: 200;
            justify-content: center;
            align-items: center;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: #0c1427;
            border: 1px solid var(--border);
            border-radius: 20px;
            width: 90%;
            max-width: 800px;
            max-height: 80vh;
            overflow-y: auto;
            padding: 28px;
            animation: modalIn 0.3s ease;
        }
        @keyframes modalIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .modal-header h2 { font-size: 18px; font-weight: 700; }
        .modal-close {
            background: none;
            border: 1px solid var(--border);
            color: var(--text2);
            width: 32px; height: 32px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.2s;
        }
        .modal-close:hover { background: rgba(255,255,255,0.05); color: var(--text); }
        .history-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
            font-family: 'JetBrains Mono', monospace;
        }
        .history-table th {
            text-align: left;
            padding: 10px 12px;
            background: rgba(0, 212, 255, 0.08);
            color: var(--cyan);
            font-weight: 600;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .history-table td {
            padding: 8px 12px;
            border-bottom: 1px solid var(--border);
            color: var(--text2);
        }
        .history-table tr:hover td { background: rgba(255,255,255,0.02); }
        .history-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 20px;
        }
        .history-stat {
            text-align: center;
            padding: 14px;
            background: rgba(255,255,255,0.02);
            border: 1px solid var(--border);
            border-radius: 12px;
        }
        .history-stat-val { font-size: 28px; font-weight: 700; font-family: 'JetBrains Mono', monospace; }
        .history-stat-label { font-size: 10px; color: var(--text2); text-transform: uppercase; letter-spacing: 1px; margin-top: 4px; }
        .separator { height: 1px; background: var(--border); margin: 12px 0; }
    </style>
</head>
<body>
    <div class="alert-overlay" id="alertOverlay"></div>
    <div class="dashboard">
        <header class="header">
            <div class="logo">
                <div class="logo-icon">🛡️</div>
                <span>CanaryShield</span>
            </div>
            <div class="status-badge inactive" id="statusBadge">
                <span class="dot"></span>
                <span id="statusText">INACTIF</span>
            </div>
        </header>

        <div class="main-content">
            <aside class="sidebar">
                <div class="card">
                    <div class="card-title">Contrôles</div>
                    <div class="controls">
                        <button class="btn btn-deploy" onclick="apiCall('deploy')">🎯 Déployer Leurres</button>
                        <button class="btn btn-start" id="btnStart" onclick="apiCall('start')">▶ Lancer Surveillance</button>
                        <button class="btn btn-stop" id="btnStop" onclick="apiCall('stop')" disabled>⏹ Arrêter</button>
                        <button class="btn btn-restore" onclick="apiCall('restore')">🔄 Restaurer Fichiers</button>
                        <div class="separator"></div>
                        <button class="btn btn-history" onclick="showHistory()">📋 Historique</button>
                        <button class="btn btn-report" onclick="downloadReport()">📄 Rapport PDF</button>
                    </div>
                </div>
                <div class="card">
                    <div class="card-title">Statistiques</div>
                    <div class="stats-grid">
                        <div class="stat-item">
                            <div class="stat-value" id="statFiles" style="color:var(--cyan)">0</div>
                            <div class="stat-label">Fichiers</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value" id="statAlerts" style="color:var(--red)">0</div>
                            <div class="stat-label">Alertes</div>
                        </div>
                    </div>
                </div>
            </aside>

            <section class="content">
                <div class="card">
                    <div class="card-title">Entropie en Temps Réel</div>
                    <div class="chart-container">
                        <canvas id="entropyChart"></canvas>
                    </div>
                </div>

                <div class="card">
                    <div class="card-title">Fichiers Canaris</div>
                    <div class="files-grid" id="filesGrid">
                        <div class="empty-state">Aucun fichier déployé</div>
                    </div>
                </div>

                <div class="card" style="flex:1">
                    <div class="card-title">Journal Système</div>
                    <div class="log-container" id="logContainer">
                        <div class="empty-state">En attente d'activité...</div>
                    </div>
                </div>
            </section>
        </div>
    </div>

    <!-- History Modal -->
    <div class="modal-overlay" id="historyModal">
        <div class="modal">
            <div class="modal-header">
                <h2>📋 Historique des Alertes</h2>
                <button class="modal-close" onclick="closeHistory()">&times;</button>
            </div>
            <div class="history-stats" id="historyStats"></div>
            <table class="history-table">
                <thead>
                    <tr><th>Date/Heure</th><th>Fichier</th><th>Entropie</th><th>Action</th></tr>
                </thead>
                <tbody id="historyBody"></tbody>
            </table>
        </div>
    </div>

<script>
const socket = io();
let alertCount = 0;
let chart;
let chartLabels = [];
let datasets = {};
const THRESHOLD = 7.5;
const fileColors = ['#00d4ff', '#00ff88', '#ffaa00', '#a78bfa', '#f472b6', '#fb923c'];
let colorIdx = 0;

// ---- CHART ----
function initChart() {
    const ctx = document.getElementById('entropyChart').getContext('2d');
    chart = new Chart(ctx, {
        type: 'line',
        data: { labels: chartLabels, datasets: [] },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            interaction: { intersect: false, mode: 'index' },
            scales: {
                y: {
                    min: 0, max: 8.5,
                    grid: { color: 'rgba(100,140,200,0.08)' },
                    ticks: { color: '#64748b', font: { family: 'JetBrains Mono', size: 11 } }
                },
                x: {
                    grid: { color: 'rgba(100,140,200,0.05)' },
                    ticks: { color: '#64748b', font: { family: 'JetBrains Mono', size: 10 }, maxTicksLimit: 10 }
                }
            },
            plugins: {
                legend: { labels: { color: '#94a3b8', font: { family: 'Inter', size: 11 }, usePointStyle: true, pointStyle: 'circle' } }
            },
            animation: { duration: 400 }
        }
    });
    // Threshold line dataset
    chart.data.datasets.push({
        label: 'Seuil (7.5)',
        data: [],
        borderColor: 'rgba(255, 48, 96, 0.5)',
        borderDash: [8, 4],
        borderWidth: 2,
        pointRadius: 0,
        fill: false
    });
    chart.update();
}

function addEntropyPoint(file, entropy, timestamp) {
    if (!chartLabels.includes(timestamp)) {
        chartLabels.push(timestamp);
        // Update threshold line
        chart.data.datasets[0].data.push(THRESHOLD);
    }
    let idx = chartLabels.indexOf(timestamp);

    if (!datasets[file]) {
        let c = fileColors[colorIdx % fileColors.length];
        colorIdx++;
        let ds = {
            label: file,
            data: new Array(chartLabels.length).fill(null),
            borderColor: c,
            backgroundColor: c + '33',
            borderWidth: 2,
            pointRadius: 4,
            pointBackgroundColor: c,
            tension: 0.3,
            fill: false
        };
        ds.data[idx] = entropy;
        chart.data.datasets.push(ds);
        datasets[file] = ds;
    } else {
        while (datasets[file].data.length < chartLabels.length) datasets[file].data.push(null);
        datasets[file].data[idx] = entropy;
    }
    // Pad all datasets
    chart.data.datasets.forEach(ds => {
        while (ds.data.length < chartLabels.length) ds.data.push(null);
    });
    chart.update();
}

// ---- STATUS ----
function setStatus(status) {
    const badge = document.getElementById('statusBadge');
    const text = document.getElementById('statusText');
    const overlay = document.getElementById('alertOverlay');
    badge.className = 'status-badge ' + status;
    const labels = { inactive: 'INACTIF', monitoring: 'SURVEILLANCE ACTIVE', alert: 'ALERTE RANSOMWARE', restored: 'FICHIERS RESTAURÉS' };
    text.textContent = labels[status] || status.toUpperCase();
    document.getElementById('btnStart').disabled = (status === 'monitoring' || status === 'alert');
    document.getElementById('btnStop').disabled = (status === 'inactive' || status === 'restored');
    overlay.classList.toggle('active', status === 'alert');
}

// ---- FILES ----
function renderFiles(files) {
    const grid = document.getElementById('filesGrid');
    document.getElementById('statFiles').textContent = files.length;
    if (!files.length) { grid.innerHTML = '<div class="empty-state">Aucun fichier déployé</div>'; return; }
    grid.innerHTML = files.map(f => `
        <div class="file-card ${f.status}">
            <div class="file-name"><span class="file-status-dot ${f.status}"></span>${f.name}</div>
            <div class="file-meta">
                <span class="file-entropy ${f.status}">${f.entropy.toFixed(2)}</span>
                <span class="file-size">${(f.size / 1024).toFixed(1)} KB</span>
            </div>
        </div>
    `).join('');
}

// ---- LOGS ----
function addLog(message, type, timestamp) {
    const container = document.getElementById('logContainer');
    if (container.querySelector('.empty-state')) container.innerHTML = '';
    const entry = document.createElement('div');
    entry.className = 'log-entry ' + type;
    entry.innerHTML = `<span class="log-time">${timestamp}</span><span class="log-msg">${message}</span>`;
    container.appendChild(entry);
    container.scrollTop = container.scrollHeight;
}

// ---- API ----
async function apiCall(action) {
    try {
        const res = await fetch('/api/' + action, { method: 'POST' });
        const data = await res.json();
        if (data.files) renderFiles(data.files);
        if (!data.success && data.message) addLog(data.message, 'info', new Date().toLocaleTimeString());
    } catch (e) {
        addLog('Erreur: ' + e.message, 'alert', new Date().toLocaleTimeString());
    }
}

// ---- SOCKET EVENTS ----
socket.on('log_message', d => addLog(d.message, d.type, d.timestamp));
socket.on('alert_message', d => {
    alertCount++;
    document.getElementById('statAlerts').textContent = alertCount;
    addLog(d.message, 'alert', d.timestamp);
});
socket.on('entropy_data', d => addEntropyPoint(d.file, d.entropy, d.timestamp));
socket.on('status_update', d => setStatus(d.status));
socket.on('files_update', d => renderFiles(d.files));

// ---- HISTORY ----
async function showHistory() {
    try {
        const res = await fetch('/api/history');
        const data = await res.json();
        const statsDiv = document.getElementById('historyStats');
        statsDiv.innerHTML = `
            <div class="history-stat">
                <div class="history-stat-val" style="color:var(--red)">${data.stats.total_alerts}</div>
                <div class="history-stat-label">Total Alertes</div>
            </div>
            <div class="history-stat">
                <div class="history-stat-val" style="color:var(--amber)">${data.stats.today_alerts}</div>
                <div class="history-stat-label">Aujourd'hui</div>
            </div>
            <div class="history-stat">
                <div class="history-stat-val" style="color:var(--cyan)">${data.stats.unique_files_hit}</div>
                <div class="history-stat-label">Fichiers Touches</div>
            </div>
        `;
        const tbody = document.getElementById('historyBody');
        if (!data.alerts.length) {
            tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;color:var(--muted);padding:20px">Aucune alerte enregistree</td></tr>';
        } else {
            tbody.innerHTML = data.alerts.map(a => `
                <tr>
                    <td>${a.timestamp}</td>
                    <td>${a.filename}</td>
                    <td style="color:${a.entropy > 7.5 ? 'var(--red)' : 'var(--green)'}; font-weight:700">${a.entropy.toFixed(2)}</td>
                    <td>${(a.action_taken || '').substring(0, 50)}</td>
                </tr>
            `).join('');
        }
        document.getElementById('historyModal').classList.add('active');
    } catch(e) {
        addLog('Erreur chargement historique: ' + e.message, 'alert', new Date().toLocaleTimeString());
    }
}

function closeHistory() {
    document.getElementById('historyModal').classList.remove('active');
}

function downloadReport() {
    addLog('Generation du rapport PDF...', 'info', new Date().toLocaleTimeString());
    window.open('/api/report', '_blank');
}

// ---- INIT ----
window.addEventListener('DOMContentLoaded', () => {
    initChart();
    fetch('/api/status').then(r => r.json()).then(d => {
        setStatus(d.status);
        if (d.files) renderFiles(d.files);
    });
    // Load alert count from DB
    fetch('/api/history').then(r => r.json()).then(d => {
        alertCount = d.stats.total_alerts;
        document.getElementById('statAlerts').textContent = alertCount;
    }).catch(() => {});
});
</script>
